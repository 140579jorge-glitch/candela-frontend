<script src="../js/age-gate.js"></script>
<script src="../js/api.js"></script>
<script>
const GRADIENTES = {
    'melocoton':['#FFF4EE','#F4A261'],'rosa-venecia':['#FFF0F5','#D4869D'],
    'lavanda':['#F7F2FF','#9B72CF'],'rojo-carmin':['#3D0A0A','#C0392B'],
    'menta':['#F0FAF7','#2ECC71'],'cielo':['#F0F8FF','#5DADE2'],
    'dorada':['#FFFBF0','#D4AC0D'],'nude':['#FAF7F4','#C4A882'],
    'noche-rosa':['#2D0A2D','#FF2D9B'],'coral':['#FFF5F2','#FF6B6B'],
    'esmeralda':['#0D1F19','#1ABC9C'],'nube':['#F5F5F5','#95A5A6'],
};

let todas = [];
let lista = [];
let paisFiltro = '';
let textoBusca = '';

function init() {
    renderTopbar();
    cargar();
}

function renderTopbar() {
    const el = document.getElementById('topbar-right');
    const user = candela.auth.user();
    if (candela.auth.isLoggedIn() && user) {
        el.innerHTML = `<button onclick="candela.auth.logout()" class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-bold text-white shadow-sm" style="background:linear-gradient(135deg,#F4A261,#E8A598)">${(user.nombre||'U')[0].toUpperCase()}</button>`;
    } else {
        el.innerHTML = `<a href="../index.html" class="text-xs font-bold text-c-accent border border-c-accent px-3 py-1.5 rounded-full hover:bg-c-accent hover:text-white transition-all">Entrar</a>`;
    }
}

async function cargar() {
    try {
        todas = await candela.creadoras.explorar({ limit: 60 });
        lista = [...todas];
        renderGrid(lista);
    } catch(e) {
        document.getElementById('grid-creadoras').innerHTML = `<div class="col-span-full text-center py-16"><p class="text-c-soft text-sm">Error al cargar. Verifica que el servidor este activo.</p></div>`;
    }
}

function filtrar(btn) {
    document.querySelectorAll('.chip').forEach(b => {
        b.classList.remove('active');
        b.classList.add('text-c-soft','bg-white','border-c-border');
    });
    btn.classList.add('active');
    btn.classList.remove('text-c-soft','bg-white');
    paisFiltro = btn.dataset.pais;
    aplicarFiltros();
}

let _buscarTimer = null;
function buscar(q) {
    textoBusca = q.trim();
    clearTimeout(_buscarTimer);
    if (!textoBusca) { aplicarFiltros(); return; }
    _buscarTimer = setTimeout(async () => {
        try {
            const params = { q: textoBusca, limit: 40 };
            if (paisFiltro) params.pais = paisFiltro;
            lista = await candela.creadoras.explorar(params);
            ordenarLista(document.getElementById('ordenar').value);
        } catch(e) {
            aplicarFiltros();
        }
    }, 350);
}

function aplicarFiltros() {
    lista = todas.filter(c => {
        const matchPais = !paisFiltro || c.pais === paisFiltro;
        const matchBusca = !textoBusca || c.nombre_artistico.toLowerCase().includes(textoBusca) || (c.pais||'').toLowerCase().includes(textoBusca);
        return matchPais && matchBusca;
    });
    ordenarLista(document.getElementById('ordenar').value);
}

function ordenarLista(criterio) {
    switch(criterio) {
        case 'destacadas': lista.sort((a,b) => b.destacada - a.destacada || b.total_suscriptores - a.total_suscriptores); break;
        case 'suscriptores': lista.sort((a,b) => b.total_suscriptores - a.total_suscriptores); break;
        case 'precio-asc': lista.sort((a,b) => a.precio_suscripcion - b.precio_suscripcion); break;
        case 'precio-desc': lista.sort((a,b) => b.precio_suscripcion - a.precio_suscripcion); break;
    }
    renderGrid(lista);
}

function renderGrid(data) {
    const grid = document.getElementById('grid-creadoras');
    const empty = document.getElementById('empty');
    document.getElementById('contador').textContent = data.length;

    if (!data.length) { grid.innerHTML=''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');

    grid.innerHTML = data.map((c, idx) => {
        const [c1,c2] = GRADIENTES[c.tema_color]||['#F2D5C4','#E8A598'];
        const inicial = c.nombre_artistico[0].toUpperCase();
        const precio = c.precio_suscripcion > 0 ? `$${c.precio_suscripcion}/mes` : 'Gratis';
        return `
        <article class="feed-card rounded-2xl overflow-hidden bg-white border border-c-border shadow-sm cursor-pointer" onclick="ir('${c.slug}')">
            <div class="relative overflow-hidden" style="aspect-ratio:4/5">
                ${c.banner_url
                    ? `<img src="${c.banner_url}" alt="${esc(c.nombre_artistico)}" class="absolute inset-0 w-full h-full object-cover">`
                    : `<div class="absolute inset-0 flex items-center justify-center" style="background:linear-gradient(135deg,${c1},${c2})">
                           <span class="font-display select-none" style="font-size:5rem;color:rgba(255,255,255,.22)">${inicial}</span>
                       </div>`}
                ${c.destacada ? `<div class="absolute top-3 left-3 px-2.5 py-1 rounded-full text-[10px] font-bold text-white border border-white/25" style="background:rgba(255,255,255,.18);backdrop-filter:blur(8px)">✨ Destacada</div>` : ''}
                <div class="card-overlay absolute inset-0 flex flex-col justify-end p-3.5">
                    <div class="flex justify-between items-end gap-2">
                        <div class="flex-1 min-w-0">
                            <div class="w-9 h-9 rounded-full border-2 border-white/70 overflow-hidden flex items-center justify-center mb-1.5 shrink-0" style="background:linear-gradient(135deg,${c1},${c2})">
                                ${c.avatar_url ? `<img src="${c.avatar_url}" alt="" class="w-full h-full object-cover">` : `<span class="text-white font-bold text-sm">${inicial}</span>`}
                            </div>
                            <h3 class="text-white font-bold text-sm leading-tight truncate">${esc(c.nombre_artistico)}</h3>
                            <p class="flex items-center gap-1.5 mt-0.5 text-white/65 text-xs">
                                <span class="w-2 h-2 rounded-full bg-white/30 inline-block"></span>${esc(c.pais||'Latam')}
                            </p>
                        </div>
                        <div class="flex flex-col gap-1.5 shrink-0">
                            <button class="action-btn" onclick="like(event,'${c.id}')"><span class="ms" style="font-size:17px">favorite</span></button>
                            <button class="action-btn" onclick="ir('${c.slug}',event)"><span class="ms" style="font-size:17px">chat_bubble</span></button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-3 flex items-center justify-between gap-2">
                <div class="min-w-0 flex-1">
                    ${c.bio?`<p class="text-c-soft text-xs line-clamp-1 mb-0.5">${c.bio}</p>`:''}
                    <span class="text-xs text-c-soft">${c.total_suscriptores} suscriptores ${c.pais?'· 📍 '+c.pais:''}</span>
                </div>
                <button onclick="ir('${c.slug}',event)" class="c-btn text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-sm shrink-0">${precio}</button>
            </div>
        </article>`;
    }).join('');
}

function navWallet() {
    if (!candela.auth.isLoggedIn()) { window.location.href='../index.html'; return; }
    const u = candela.auth.user();
    if (u?.tipo === 'creadora') window.location.href='dashboard-creadora.html';
    else window.location.href='feed.html';
}

function ir(slug, e) { if(e) e.stopPropagation(); window.location.href=`creadora.html?slug=${slug}`; }
function like(e, id) {
    e.stopPropagation();
    const btn = e.currentTarget;
    btn.classList.toggle('liked');
    const icon = btn.querySelector('.ms');
    if (btn.classList.contains('liked')) { icon.style.fontVariationSettings="'FILL' 1"; icon.style.color='#F4A261'; }
    else { icon.style.fontVariationSettings="'FILL' 0"; icon.style.color=''; }
}

function toast(msg,tipo='info'){const c=document.getElementById('toasts');const col={error:'#e74c3c',success:'#2ecc71',info:'#F4A261'};const el=document.createElement('div');el.style.cssText=`background:#fff;border:1px solid #F0E6E1;border-left:4px solid ${col[tipo]||col.info};padding:.8rem 1rem;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.09);font-size:.85rem;max-width:280px;pointer-events:auto;opacity:0;transform:translateX(100%);transition:all .25s ease;`;el.textContent=msg;c.appendChild(el);requestAnimationFrame(()=>{el.style.opacity='1';el.style.transform='translateX(0)';});setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(100%)';setTimeout(()=>el.remove(),300);},3800);}

init();
</script>
</body>
