<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña — Candela</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "c-bg": "#FFF8F5",
                        "c-accent": "#F4A261",
                        "c-accent-d": "#E08947",
                        "c-rose": "#E8A598",
                        "c-champagne": "#F2D5C4",
                        "c-text": "#2D2D2D",
                        "c-soft": "#8B7D77",
                        "c-border": "#F0E6E1",
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background: #FFF8F5; }
        .logo-font { font-family: 'Playfair Display', serif; }
        .btn-gradient { background: linear-gradient(135deg, #F4A261, #E8A598); }
        .btn-gradient:hover { background: linear-gradient(135deg, #E08947, #D4917E); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="../index.html" class="logo-font text-4xl text-c-accent font-bold tracking-widest">Candela</a>
            <p class="text-c-soft text-sm mt-1">Descubre. Desea. Apoya.</p>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-c-border p-8">

            <!-- Estado: solicitar link -->
            <div id="vista-solicitar">
                <h1 class="text-2xl font-bold text-c-text mb-2">¿Olvidaste tu contraseña?</h1>
                <p class="text-c-soft text-sm mb-6">
                    Ingresa tu email y te enviaremos un enlace para restablecerla.
                </p>
                <form id="form-solicitar" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-c-text mb-1">Email</label>
                        <input id="email-input" type="email" required placeholder="tu@email.com"
                            class="w-full border border-c-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-c-accent transition-colors">
                    </div>
                    <button type="submit" id="btn-solicitar"
                        class="btn-gradient w-full text-white font-bold py-3 rounded-xl text-sm transition-all">
                        Enviar enlace de recuperación
                    </button>
                </form>
                <p class="text-center text-sm text-c-soft mt-6">
                    <a href="../index.html" class="text-c-accent hover:text-c-accent-d font-semibold">Volver al inicio</a>
                </p>
            </div>

            <!-- Estado: resetear (hay token en URL) -->
            <div id="vista-resetear" class="hidden">
                <h1 class="text-2xl font-bold text-c-text mb-2">Nueva contraseña</h1>
                <p class="text-c-soft text-sm mb-6">
                    Elige una contraseña segura de al menos 8 caracteres.
                </p>
                <form id="form-resetear" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-c-text mb-1">Nueva contraseña</label>
                        <input id="pass-input" type="password" required minlength="8" placeholder="Mínimo 8 caracteres"
                            class="w-full border border-c-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-c-accent transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-c-text mb-1">Confirmar contraseña</label>
                        <input id="pass-confirm" type="password" required minlength="8" placeholder="Repite la contraseña"
                            class="w-full border border-c-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-c-accent transition-colors">
                    </div>
                    <button type="submit" id="btn-resetear"
                        class="btn-gradient w-full text-white font-bold py-3 rounded-xl text-sm transition-all">
                        Establecer nueva contraseña
                    </button>
                </form>
            </div>

            <!-- Estado: exito -->
            <div id="vista-exito" class="hidden text-center">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
                <h2 class="text-xl font-bold text-c-text mb-2" id="exito-titulo">¡Listo!</h2>
                <p class="text-c-soft text-sm mb-6" id="exito-msg"></p>
                <a href="../index.html" class="btn-gradient inline-block text-white font-bold py-3 px-8 rounded-xl text-sm">
                    Ir al inicio
                </a>
            </div>

            <!-- Alerta de error -->
            <div id="alerta-error" class="hidden mt-4 bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-red-700 text-sm"></div>

        </div>
    </div>

    <script>
        const API_BASE = 'https://web-production-73189.up.railway.app';

        const vistaSolicitar = document.getElementById('vista-solicitar');
        const vistaResetear = document.getElementById('vista-resetear');
        const vistaExito = document.getElementById('vista-exito');
        const alertaError = document.getElementById('alerta-error');

        function mostrarError(msg) {
            alertaError.textContent = msg;
            alertaError.classList.remove('hidden');
            setTimeout(() => alertaError.classList.add('hidden'), 6000);
        }

        // Detectar si hay token en la URL
        const params = new URLSearchParams(window.location.search);
        const tokenURL = params.get('token');

        if (tokenURL) {
            vistaSolicitar.classList.add('hidden');
            vistaResetear.classList.remove('hidden');
        }

        // Formulario: solicitar link
        document.getElementById('form-solicitar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-solicitar');
            const email = document.getElementById('email-input').value.trim();
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            try {
                await fetch(`${API_BASE}/api/auth/recuperar-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });
                vistaSolicitar.classList.add('hidden');
                vistaExito.classList.remove('hidden');
                document.getElementById('exito-titulo').textContent = 'Revisa tu email';
                document.getElementById('exito-msg').textContent =
                    'Si existe una cuenta con ese email, recibirás un enlace para restablecer tu contraseña. Revisa también tu carpeta de spam.';
            } catch {
                mostrarError('Ocurrió un error. Por favor, intenta de nuevo.');
                btn.disabled = false;
                btn.textContent = 'Enviar enlace de recuperación';
            }
        });

        // Formulario: nueva contraseña
        document.getElementById('form-resetear').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('pass-input').value;
            const confirm = document.getElementById('pass-confirm').value;
            if (pass !== confirm) {
                mostrarError('Las contraseñas no coinciden.');
                return;
            }
            const btn = document.getElementById('btn-resetear');
            btn.disabled = true;
            btn.textContent = 'Guardando...';
            try {
                const res = await fetch(`${API_BASE}/api/auth/resetear-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: tokenURL, nueva_password: pass }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error al restablecer');
                vistaResetear.classList.add('hidden');
                vistaExito.classList.remove('hidden');
                document.getElementById('exito-titulo').textContent = 'Contraseña actualizada';
                document.getElementById('exito-msg').textContent =
                    'Tu contraseña ha sido restablecida correctamente. Ya puedes iniciar sesión.';
            } catch (err) {
                mostrarError(err.message || 'El enlace es inválido o ha expirado.');
                btn.disabled = false;
                btn.textContent = 'Establecer nueva contraseña';
            }
        });
    </script>

<script src="/js/cookie-consent.js"></script>
</body>
</html>
