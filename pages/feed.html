<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Feed — Candela</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "c-bg":"#FFF8F5","c-accent":"#F4A261","c-accent-d":"#E08947",
                        "c-rose":"#E8A598","c-champagne":"#F2D5C4","c-text":"#2D2D2D",
                        "c-soft":"#8B7D77","c-border":"#F0E6E1"
                    },
                    fontFamily:{ display:["Playfair Display","serif"], body:["Nunito","sans-serif"] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <style>
        body { font-family:'Nunito',sans-serif; }
        .glass { background:rgba(255,248,245,.88); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
        .logo-text { background:linear-gradient(90deg,#F4A261,#E8A598,#D4869D); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .ms { font-family:'Material Symbols Outlined';font-style:normal;font-size:22px;line-height:1;user-select:none; }
        .ms-fill { font-variation-settings:'FILL' 1; }
        /* Feed card */
        .feed-card { background:#fff;border:1px solid #F0E6E1;border-radius:1.25rem;overflow:hidden;transition:box-shadow .2s; }
        .feed-card:hover { box-shadow:0 8px 32px rgba(244,162,97,.12); }
        /* Media protegida */
        .media-wrap { position:relative;overflow:hidden;background:#F2D5C4; }
        .media-wrap img, .media-wrap video {
            width:100%;display:block;
            pointer-events:none;
            -webkit-user-drag:none;
            user-drag:none;
        }
        .media-wrap video { pointer-events:auto; }
        /* Watermark */
        .wm-layer { position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden; }
        .wm-text { position:absolute;color:rgba(255,255,255,.15);font-size:10px;font-weight:800;white-space:nowrap;transform:rotate(-35deg);font-family:'Nunito',sans-serif;letter-spacing:1.5px;text-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;user-select:none; }
        /* Privacy blur */
        body.privacy-mode .media-wrap img,
        body.privacy-mode .media-wrap video { filter:blur(30px) !important; }
        /* Skeleton */
        @keyframes shimmer { 0%{background-position:-300% 0} 100%{background-position:300% 0} }
        .skeleton { background:linear-gradient(90deg,#F2D5C4 25%,#FFF0EA 50%,#F2D5C4 75%);background-size:300% 100%;animation:shimmer 1.6s infinite;border-radius:12px; }
    </style>
</head>
<body class="bg-c-bg text-c-text antialiased min-h-screen pb-24">

<!-- TopBar -->
<header class="glass fixed top-0 w-full z-50 border-b border-c-border" style="box-shadow:0 2px 16px rgba(244,162,97,.07)">
    <div class="flex items-center justify-between h-14 px-4 max-w-2xl mx-auto">
        <a href="../index.html" class="font-display text-xl font-semibold logo-text">Candela</a>
        <div class="flex items-center gap-2">
            <button id="btn-avatar" onclick="candela.auth.logout()" title="Salir" class="w-9 h-9 rounded-full text-white text-sm font-bold flex items-center justify-center shadow-sm" style="background:linear-gradient(135deg,#F4A261,#E8A598)">?</button>
        </div>
    </div>
</header>

<!-- Nav top secundario -->
<div class="pt-14 pb-0">
    <div class="flex gap-1 px-4 py-3 max-w-2xl mx-auto overflow-x-auto no-scrollbar">
        <button onclick="mostrarTab('feed',this)" id="tab-feed" class="tab-btn shrink-0 px-4 py-1.5 rounded-full text-xs font-bold bg-c-accent text-white transition-all">
            <span class="ms" style="font-size:14px;vertical-align:-2px">home</span> Mi feed
        </button>
        <button onclick="mostrarTab('suscripciones',this)" id="tab-subs" class="tab-btn shrink-0 px-4 py-1.5 rounded-full text-xs font-bold text-c-soft bg-white border border-c-border hover:border-c-accent hover:text-c-accent transition-all">
            <span class="ms" style="font-size:14px;vertical-align:-2px">favorite</span> Mis suscripciones
        </button>
        <a href="explorar.html" class="shrink-0 px-4 py-1.5 rounded-full text-xs font-bold text-c-soft bg-white border border-c-border hover:border-c-accent hover:text-c-accent transition-all flex items-center gap-1">
            <span class="ms" style="font-size:14px;vertical-align:-2px">explore</span> Explorar
        </a>
    </div>
</div>

<main class="max-w-2xl mx-auto px-4 py-4">

    <!-- FEED -->
    <div id="sec-feed">
        <div id="feed-skeleton" class="flex flex-col gap-4">
            <div class="skeleton h-80 rounded-2xl"></div>
            <div class="skeleton h-80 rounded-2xl"></div>
        </div>
        <div id="feed-lista" class="hidden flex flex-col gap-4"></div>
        <div id="feed-empty" class="hidden text-center py-16">
            <div class="inline-block bg-gradient-to-br from-c-champagne to-c-rose rounded-3xl p-5 mb-4">
                <span class="ms" style="font-size:3rem;color:#E08947">photo_library</span>
            </div>
            <h2 class="font-display text-xl font-semibold mb-2">Tu feed esta vacio</h2>
            <p class="text-c-soft text-sm mb-5">Suscribete a una creadora para ver su contenido aqui.</p>
            <a href="explorar.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold text-sm text-white shadow-md" style="background:linear-gradient(135deg,#F4A261,#E8A598)">
                <span class="ms" style="font-size:18px">explore</span> Explorar creadoras
            </a>
        </div>
    </div>

    <!-- SUSCRIPCIONES -->
    <div id="sec-suscripciones" class="hidden">
        <h2 class="font-bold text-base mb-3">Mis suscripciones activas</h2>
        <div id="subs-lista" class="flex flex-col gap-3">
            <div class="skeleton h-16 rounded-xl"></div>
            <div class="skeleton h-16 rounded-xl"></div>
        </div>
        <div id="subs-empty" class="hidden text-center py-12">
            <p class="text-c-soft text-sm mb-4">No tienes suscripciones activas.</p>
            <a href="explorar.html" class="text-c-accent font-bold text-sm hover:underline">Explorar creadoras</a>
        </div>
    </div>

</main>

<!-- Bottom nav -->
<nav class="glass fixed bottom-0 w-full z-50 border-t border-c-border rounded-t-2xl" style="box-shadow:0 -4px 20px rgba(244,162,97,.1)">
    <div class="flex justify-around items-center h-16 px-2 max-w-md mx-auto">
        <a href="../index.html" class="flex flex-col items-center text-c-soft hover:text-c-accent transition-colors gap-0.5">
            <span class="ms">home</span><span class="text-[10px] font-semibold">Inicio</span>
        </a>
        <button class="flex flex-col items-center text-c-accent gap-0.5">
            <span class="ms ms-fill">photo_library</span><span class="text-[10px] font-bold">Feed</span>
        </button>
        <a href="explorar.html" class="flex flex-col items-center text-c-soft hover:text-c-accent transition-colors gap-0.5">
            <span class="ms">explore</span><span class="text-[10px] font-semibold">Explorar</span>
        </a>
        <button onclick="candela.auth.logout()" class="flex flex-col items-center text-c-soft hover:text-c-accent transition-colors gap-0.5">
            <span class="ms">logout</span><span class="text-[10px] font-semibold">Salir</span>
        </button>
    </div>
</nav>

<!-- Visor de contenido -->
<div id="visor" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.96);align-items:center;justify-content:center;" onclick="cerrarVisor(event)">
    <button onclick="cerrarVisor()" style="position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.1);border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;">
        <span class="ms" style="color:#fff;font-size:20px">close</span>
    </button>
    <div style="position:relative;display:inline-block;max-width:96vw;" id="visor-wrap">
        <img id="visor-img" src="" alt="" style="display:none;max-height:90vh;border-radius:.75rem;pointer-events:none;-webkit-user-drag:none;">
        <video id="visor-video" controls controlsList="nodownload nofullscreen noplaybackrate" disablePictureInPicture style="display:none;max-height:90vh;border-radius:.75rem;" oncontextmenu="return false"></video>
        <div class="wm-layer" id="visor-wm"></div>
    </div>
</div>

<div id="toasts" class="fixed bottom-24 right-4 z-[300] flex flex-col gap-2 pointer-events-none"></div>

<script src="../js/age-gate.js"></script>
<script src="../js/api.js"></script>
<script>
const API_BASE = 'https://web-production-73189.up.railway.app';
let feedData = [];

async function init() {
    if (!candela.auth.isLoggedIn()) { window.location.href = '../index.html'; return; }
    const u = candela.auth.user();
    // Avatar inicial
    const av = document.getElementById('btn-avatar');
    av.textContent = (u?.nombre || 'U')[0].toUpperCase();

    cargarFeed();
}

async function cargarFeed() {
    try {
        feedData = await candela.contenido.feed();
        document.getElementById('feed-skeleton').classList.add('hidden');
        const lista = document.getElementById('feed-lista');
        const empty = document.getElementById('feed-empty');

        if (!feedData.length) { empty.classList.remove('hidden'); return; }

        lista.classList.remove('hidden');
        lista.innerHTML = feedData.map(item => renderCard(item)).join('');
    } catch(e) {
        document.getElementById('feed-skeleton').classList.add('hidden');
        document.getElementById('feed-empty').classList.remove('hidden');
    }
}

function renderCard(item) {
    const mediaUrl = item.url_archivo ? (API_BASE + item.url_archivo) : '';
    const previewUrl = item.preview_url ? (API_BASE + item.preview_url) : '';
    const esVideo = item.tipo === 'video';

    return `
    <div class="feed-card">
        <!-- Header -->
        <div class="flex items-center gap-3 px-4 pt-4 pb-3">
            <a href="creadora.html?slug=${item.creadora_slug||''}" class="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0" style="background:linear-gradient(135deg,#F4A261,#E8A598)">
                ${(item.creadora_nombre||'?')[0].toUpperCase()}
            </a>
            <div class="flex-1 min-w-0">
                <a href="creadora.html?slug=${item.creadora_slug||''}" class="font-bold text-sm hover:text-c-accent transition-colors">${item.creadora_nombre||'Creadora'}</a>
                <p class="text-xs text-c-soft">${fmtFecha(item.publicado_en)}</p>
            </div>
            ${item.tipo === 'video' ? `<span class="ms text-c-soft" style="font-size:18px">videocam</span>` : ''}
        </div>

        <!-- Media -->
        <div class="media-wrap" style="aspect-ratio:4/5;cursor:pointer;" onclick="abrirVisor('${item.id}','${item.tipo}','${mediaUrl}')">
            ${previewUrl
                ? `<img src="${previewUrl}" alt="${item.titulo||''}" style="width:100%;height:100%;object-fit:cover;" draggable="false" oncontextmenu="return false">`
                : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FFF4EE,#F2D5C4);font-size:3rem;">${esVideo ? '🎬' : '📸'}</div>`
            }
            ${esVideo ? `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;"><div style="width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;"><span class="ms ms-fill" style="color:#fff;font-size:26px">play_arrow</span></div></div>` : ''}
            <div class="wm-layer" id="wm-${item.id}"></div>
        </div>

        <!-- Footer -->
        <div class="px-4 py-3">
            ${item.titulo ? `<p class="font-semibold text-sm mb-0.5">${item.titulo}</p>` : ''}
            ${item.descripcion ? `<p class="text-xs text-c-soft leading-relaxed">${item.descripcion}</p>` : ''}
        </div>
    </div>`;
}

function aplicarWatermarks() {
    const u = candela.auth.user();
    const label = (u?.nombre || u?.email?.split('@')[0] || 'usuario') + ' · candela';
    feedData.forEach(item => {
        const wm = document.getElementById('wm-' + item.id);
        if (!wm || wm.children.length) return;
        for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 3; c++) {
                const span = document.createElement('span');
                span.className = 'wm-text';
                span.style.left = (c * 33 + 4) + '%';
                span.style.top  = (r * 33 + 8) + '%';
                span.textContent = label;
                wm.appendChild(span);
            }
        }
    });
}

// ─── SUSCRIPCIONES ───────────────────────────────────────────
async function cargarSuscripciones() {
    const lista = document.getElementById('subs-lista');
    const empty = document.getElementById('subs-empty');
    lista.innerHTML = '<div class="skeleton h-16 rounded-xl"></div><div class="skeleton h-16 rounded-xl mt-3"></div>';
    try {
        const subs = await candela.pagos.misSuscripciones();
        if (!subs.length) { lista.innerHTML = ''; empty.classList.remove('hidden'); return; }
        empty.classList.add('hidden');
        lista.innerHTML = subs.map(s => `
            <div class="bg-white border border-c-border rounded-xl p-4 flex items-center gap-3">
                <a href="creadora.html?slug=${s.creadora_slug||''}" class="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0" style="background:linear-gradient(135deg,#F4A261,#E8A598)">
                    ${(s.creadora_nombre||'?')[0].toUpperCase()}
                </a>
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-sm">${s.creadora_nombre||'-'}</p>
                    <p class="text-xs text-c-soft">Vence: ${fmtFecha(s.fecha_fin)}</p>
                </div>
                <span class="text-xs font-bold px-2.5 py-1 rounded-full" style="background:rgba(46,204,113,.1);color:#27ae60;border:1px solid rgba(46,204,113,.3)">Activa</span>
            </div>`).join('');
    } catch(e) { lista.innerHTML = ''; empty.classList.remove('hidden'); }
}

// ─── TABS ─────────────────────────────────────────────────────
function mostrarTab(tab, btn) {
    document.getElementById('sec-feed').classList.toggle('hidden', tab !== 'feed');
    document.getElementById('sec-suscripciones').classList.toggle('hidden', tab !== 'suscripciones');
    document.querySelectorAll('.tab-btn').forEach(b => {
        b.className = b.className.replace('bg-c-accent text-white', 'text-c-soft bg-white border border-c-border hover:border-c-accent hover:text-c-accent');
    });
    btn.className = btn.className.replace('text-c-soft bg-white border border-c-border hover:border-c-accent hover:text-c-accent', 'bg-c-accent text-white');
    if (tab === 'suscripciones') cargarSuscripciones();
}

// ─── VISOR ────────────────────────────────────────────────────
function abrirVisor(id, tipo, url) {
    const visor = document.getElementById('visor');
    const img   = document.getElementById('visor-img');
    const vid   = document.getElementById('visor-video');
    const wm    = document.getElementById('visor-wm');

    img.style.display = 'none';
    vid.style.display = 'none';
    vid.pause?.();

    if (tipo === 'video' && url) {
        vid.src = url;
        vid.style.display = 'block';
    } else if (url) {
        img.src = url;
        img.style.display = 'block';
    }

    // Watermark en visor
    wm.innerHTML = '';
    const u = candela.auth.user();
    const label = (u?.nombre || u?.email?.split('@')[0] || 'usuario') + ' · candela';
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            const span = document.createElement('span');
            span.className = 'wm-text';
            span.style.left = (c * 25 + 2) + '%';
            span.style.top  = (r * 25 + 4) + '%';
            span.style.color = 'rgba(255,255,255,.2)';
            span.textContent = label;
            wm.appendChild(span);
        }
    }

    visor.style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function cerrarVisor(e) {
    if (e && e.target !== document.getElementById('visor') && !e.target.closest('button')) return;
    const vid = document.getElementById('visor-video');
    vid.pause?.(); vid.src = '';
    document.getElementById('visor').style.display = 'none';
    document.body.style.overflow = '';
}

// ─── PROTECCIONES ─────────────────────────────────────────────
document.addEventListener('contextmenu', e => {
    if (e.target.closest('.media-wrap') || e.target.closest('#visor')) e.preventDefault();
});
document.addEventListener('visibilitychange', () => {
    document.body.classList.toggle('privacy-mode', document.hidden);
});
window.addEventListener('blur', () => document.body.classList.add('privacy-mode'));
window.addEventListener('focus', () => document.body.classList.remove('privacy-mode'));
document.addEventListener('keydown', e => {
    if (e.ctrlKey && (e.key === 's' || e.key === 'S') && e.target.tagName !== 'INPUT') {
        e.preventDefault();
    }
});

// ─── UTILS ────────────────────────────────────────────────────
function fmtFecha(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const ahora = new Date();
    const diff = Math.floor((ahora - d) / 1000);
    if (diff < 60) return 'Hace un momento';
    if (diff < 3600) return `Hace ${Math.floor(diff/60)} min`;
    if (diff < 86400) return `Hace ${Math.floor(diff/3600)} h`;
    if (diff < 604800) return `Hace ${Math.floor(diff/86400)} dias`;
    return d.toLocaleDateString('es-BO', { day:'2-digit', month:'short' });
}

function toast(msg, tipo='info') {
    const c = document.getElementById('toasts');
    const col = { error:'#e74c3c', success:'#2ecc71', info:'#F4A261' };
    const el = document.createElement('div');
    el.style.cssText = `background:#fff;border:1px solid #F0E6E1;border-left:4px solid ${col[tipo]||col.info};padding:.8rem 1rem;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.09);font-size:.85rem;max-width:280px;pointer-events:auto;opacity:0;transform:translateX(100%);transition:all .25s ease;`;
    el.textContent = msg;
    c.appendChild(el);
    requestAnimationFrame(() => { el.style.opacity='1'; el.style.transform='translateX(0)'; });
    setTimeout(() => { el.style.opacity='0'; el.style.transform='translateX(100%)'; setTimeout(()=>el.remove(),300); }, 3800);
}

init().then(() => {
    // Watermarks despues de que el DOM esta poblado
    setTimeout(aplicarWatermarks, 500);
});
</script>
</body>
</html>
