<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Email — Candela</title>
<link rel="stylesheet" href="../css/tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
    <style>
        body { font-family:'Nunito',sans-serif; background:#FDF8F5; color:#2D2D2D; }
        .logo-text { background:linear-gradient(90deg,#B5445C,#F2B8C8,#D4869D); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    </style>
    <script src="/js/ui-events.js"></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center px-4">

    <a href="../index.html" class="logo-text font-display font-bold text-3xl mb-10">Candela</a>

    <!-- Estado: verificando -->
    <div id="estado-verificando" class="text-center">
        <div class="w-16 h-16 border-4 border-c-champagne border-t-c-accent rounded-full animate-spin mx-auto mb-6"></div>
        <p class="text-c-soft font-semibold">Verificando tu email...</p>
    </div>

    <!-- Estado: exito -->
    <div id="estado-ok" class="hidden text-center max-w-sm">
        <div class="w-20 h-20 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-6">
            <span class="material-symbols-outlined text-green-600" style="font-size:40px;font-variation-settings:'FILL' 1">check_circle</span>
        </div>
        <h1 class="font-display text-2xl font-semibold text-c-text mb-2">Email verificado</h1>
        <p class="text-c-soft mb-8">Tu cuenta está activa. Ya puedes ingresar y disfrutar Candela.</p>
        <a href="../index.html?login=1"
           class="inline-flex items-center gap-2 bg-c-accent text-white font-bold px-8 py-3 rounded-full hover:bg-c-accent-d transition-colors">
            <span class="material-symbols-outlined" style="font-size:18px">login</span>
            Ingresar ahora
        </a>
    </div>

    <!-- Estado: error -->
    <div id="estado-error" class="hidden text-center max-w-sm">
        <div class="w-20 h-20 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-6">
            <span class="material-symbols-outlined text-red-500" style="font-size:40px">error</span>
        </div>
        <h1 class="font-display text-2xl font-semibold text-c-text mb-2">Enlace inválido</h1>
        <p id="error-msg" class="text-c-soft mb-6">El enlace de verificación es inválido o ya expiró.</p>
        <div class="bg-c-champagne rounded-2xl p-5 text-left mb-6">
            <p class="text-sm font-semibold text-c-text mb-2">Solicita un nuevo enlace</p>
            <div class="flex gap-2">
                <input id="email-reenvio" type="email" placeholder="tu@email.com"
                    class="flex-1 border border-c-border rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:border-c-accent">
                <button data-on-click="reenviar()" id="btn-reenviar"
                    class="bg-c-accent text-white font-bold px-4 py-2 rounded-xl text-sm hover:bg-c-accent-d transition-colors whitespace-nowrap">
                    Reenviar
                </button>
            </div>
        </div>
        <a href="../index.html" class="text-c-soft text-sm hover:text-c-accent transition-colors">Volver al inicio</a>
    </div>

<script src="/js/p/verificar-email.js"></script>
<script src="/js/cookie-consent.js"></script>
<script src="/js/pwa-install.js"></script>
</body>
</html>
